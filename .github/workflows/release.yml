name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            name: linux-amd64
            ext: ''
          - goos: darwin
            goarch: amd64
            name: darwin-amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            name: darwin-arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o "dist/auto-permissions-${{ matrix.name }}${{ matrix.ext }}" \
            ./cmd/auto-permissions

      - uses: actions/upload-artifact@v4
        with:
          name: auto-permissions-${{ matrix.name }}
          path: dist/auto-permissions-${{ matrix.name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
